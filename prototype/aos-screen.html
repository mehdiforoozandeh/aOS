<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>aOS</title>
<style>
:root{
  --bg:#0b0d11; --tile:#151920; --tile2:#1b2029; --line:#262c37;
  --ink:#eef2f8; --dim:#98a3b6; --faint:#68738a;
  --accent:#7cb0ff; --good:#63d6a4; --warn:#f5bd4f; --bad:#f4706b;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:16px;
}
*{box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}

/* ============ the app ============ */
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:18px;gap:14px}
#canvas{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px}
.trow{display:flex;gap:14px;min-height:0}
.tile{background:var(--tile);border:1px solid var(--line);border-radius:var(--r);
  padding:20px 22px;overflow:hidden;min-width:0;display:flex;flex-direction:column;gap:12px;
  animation:in .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.tile.out{animation:out .3s ease-in forwards}
@keyframes out{to{opacity:0;transform:scale(.98)}}

/* ============ strip — always visible, agent can't hide it ============ */
#strip{flex:none;display:flex;align-items:center;gap:14px;background:var(--tile);
  border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 12px 20px}
#dot{width:9px;height:9px;border-radius:50%;background:var(--faint);flex:none;transition:.3s}
#dot.busy{background:var(--warn);animation:pulse 1.1s infinite}
#dot.live{background:var(--good)}
@keyframes pulse{50%{opacity:.25}}
#say{flex:1;min-width:0;color:var(--dim);font-size:15px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#back{display:none}
.sbtn{background:var(--tile2);border:1px solid var(--line);color:var(--ink);
  border-radius:11px;padding:10px 16px;font:inherit;font-size:14px;cursor:pointer;flex:none}
.sbtn:hover{border-color:#3a4352}
#mic{background:var(--accent);color:#08172b;border:0;font-weight:650;
  border-radius:11px;padding:11px 20px;cursor:pointer;font:inherit;font-size:14px;font-weight:650;flex:none}
#mic.on{background:var(--bad);color:#fff}

/* ============ blocks ============ */
h2.bt{margin:0;font-size:19px;font-weight:640;letter-spacing:-.015em}
p.bd{margin:0;color:var(--dim);font-size:14px}
.clock{font-size:clamp(56px,9vw,120px);font-weight:150;letter-spacing:-.04em;line-height:1;margin:0}
.cdate{margin:10px 0 0;color:var(--faint);font-size:clamp(15px,1.6vw,20px);font-weight:300}
.ambient{justify-content:center;align-items:center;text-align:center;background:transparent;border-color:transparent}

.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;overflow:auto}
.g{background:var(--tile2);border:1px solid var(--line);border-radius:13px;overflow:hidden;
  cursor:pointer;transition:.18s}
.g:hover{border-color:var(--accent);transform:translateY(-2px)}
.g[data-sel=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.g .pic{height:74px;display:grid;place-items:center;font-size:30px}
.g .mt{padding:10px 12px}
.g .mt b{display:block;font-weight:600;font-size:14px}
.g .mt span{color:var(--faint);font-size:12.5px}

table.dv{width:100%;border-collapse:collapse;font-size:14px}
table.dv th{text-align:left;color:var(--faint);font-weight:500;font-size:12px;
  padding:0 0 8px;border-bottom:1px solid var(--line)}
table.dv td{padding:9px 0;border-bottom:1px solid #1e232c}
table.dv td:last-child,table.dv th:last-child{text-align:right}

.cal{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:auto 1fr;
  gap:6px;flex:1;min-height:0}
.cal .hd{color:var(--faint);font-size:12px;text-align:center;padding-bottom:2px}
.cal .cel{background:#10141a;border:1px solid var(--line);border-radius:9px;padding:6px;overflow:hidden}
.cal .cel.today{border-color:var(--accent)}
.ev{background:#1e2c40;border-left:2px solid var(--accent);border-radius:4px;
  padding:4px 6px;margin-bottom:4px;font-size:11.5px;line-height:1.35}
.ev b{display:block;font-weight:600}
.ev.new{background:#1e3a2c;border-color:var(--good)}

.fld{width:100%;background:#0f131a;border:1px solid var(--line);color:var(--ink);
  border-radius:11px;padding:12px 14px;font:inherit;font-size:14.5px}
.fld:focus{outline:none;border-color:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:#0f131a;border:1px solid var(--line);color:var(--dim);border-radius:22px;
  padding:8px 15px;cursor:pointer;font:inherit;font-size:13.5px;transition:.15s}
.chip:hover{border-color:#3a4352;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--accent);color:#08172b;border-color:var(--accent);font-weight:600}
.act{background:var(--accent);color:#08172b;border:0;border-radius:11px;padding:12px 20px;
  font:inherit;font-weight:650;font-size:14.5px;cursor:pointer;align-self:flex-start}
.act.g2{background:transparent;color:var(--dim);border:1px solid var(--line);font-weight:500}

.sys{border-radius:12px;padding:15px 17px;display:flex;flex-direction:column;gap:10px}
.sys.confirm{background:#241d09;border:1px solid #5a4715}
.sys.ask{background:#131f30;border:1px solid #2b4straight}
.sys.ask{background:#131f30;border:1px solid #2b4568}
.sys.error{background:#2a1517;border:1px solid #5d2b2d}
.sys .lbl{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.sys.confirm .lbl{color:var(--warn)} .sys.error .lbl{color:var(--bad)}
.lock{font:11.5px var(--mono);color:var(--warn);opacity:.8}
.row{display:flex;gap:9px;flex-wrap:wrap}
.brow{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.brow>*{flex:1 1 auto;min-width:0}
.bcol{display:flex;flex-direction:column;gap:12px;min-width:0}
.bcard{background:var(--tile2);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.unk{color:var(--bad);font:11.5px var(--mono);border:1px dashed var(--bad);
  border-radius:8px;padding:6px 9px}

.status{display:flex;align-items:center;gap:13px}
.ring{width:38px;height:38px;flex:none;border-radius:50%;
  border:3px solid #26303f;border-top-color:var(--good);animation:spin 1.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.status b{display:block;font-weight:600;font-size:15px}
.status span{color:var(--faint);font-size:13px}

/* foreign — their app, whole */
.foreign{flex:1;background:#fff;color:#16181d;border-radius:12px;overflow:hidden;
  display:flex;flex-direction:column;min-height:0}
.fchrome{background:#f2f3f5;border-bottom:1px solid #e0e2e6;padding:9px 15px;
  font:12px var(--mono);color:#7a808b;display:flex;gap:9px;align-items:center}
.fchrome .u{background:#fff;border:1px solid #e0e2e6;border-radius:7px;padding:4px 11px;flex:1}
.fbody{flex:1;padding:22px;overflow:auto;min-height:0}

/* ============ listening ============ */
#listen{position:fixed;inset:0;background:#080a0ecc;backdrop-filter:blur(14px);
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:26px;z-index:40}
#listen.on{display:flex}
.wave{display:flex;gap:5px;align-items:center;height:64px}
.wave i{width:5px;background:var(--accent);border-radius:3px;animation:w .9s ease-in-out infinite}
@keyframes w{0%,100%{height:10px}50%{height:52px}}
#heard{font-size:26px;font-weight:300;letter-spacing:-.01em;min-height:34px;text-align:center;
  max-width:min(90vw,700px)}
#heard.ph{color:var(--faint)}
#vin{width:min(90vw,560px);background:#12161d;border:1px solid var(--line);color:var(--ink);
  border-radius:14px;padding:15px 18px;font:inherit;font-size:17px;text-align:center}
#vin:focus{outline:none;border-color:var(--accent)}
#tryit{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;max-width:min(92vw,760px)}
#lhint{color:var(--faint);font-size:13px}

/* ============ admin ============ */
#admin{position:fixed;top:0;right:0;bottom:0;width:min(94vw,470px);background:#0d1015f2;
  backdrop-filter:blur(20px);border-left:1px solid var(--line);z-index:60;
  transform:translateX(100%);transition:.28s cubic-bezier(.2,.8,.2,1);
  overflow:auto;padding:20px}
#admin.on{transform:none}
#admin h3{margin:0 0 4px;font-size:15px;font-weight:600}
#admin .sub{color:var(--faint);font-size:12.5px;margin:0 0 18px}
#admin section{margin-bottom:18px}
#admin h4{margin:0 0 8px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
#admin pre{margin:0;font:11.5px/1.6 var(--mono);color:var(--dim);white-space:pre-wrap;
  background:#0a0d12;border:1px solid var(--line);border-radius:10px;padding:11px;
  max-height:240px;overflow:auto}
#admin .k{color:var(--accent)}
#admin .warnln{color:var(--warn)} #admin .badln{color:var(--bad)} #admin .goodln{color:var(--good)}
#admin .close{position:absolute;top:16px;right:18px;background:none;border:0;color:var(--faint);
  font-size:22px;cursor:pointer;line-height:1}
.kbd{font:11px var(--mono);background:#1b2029;border:1px solid var(--line);
  border-radius:5px;padding:2px 6px;color:var(--dim)}
#gear{position:fixed;bottom:14px;right:14px;z-index:30;background:#171b23;border:1px solid var(--line);
  color:var(--faint);width:30px;height:30px;border-radius:9px;cursor:pointer;font-size:13px;opacity:.45}
#gear:hover{opacity:1}
</style>
</head>
<body>

<div id="app">
  <div id="canvas"></div>
  <div id="strip">
    <span id="dot"></span>
    <span id="say">Say something.</span>
    <button class="sbtn" id="back">← my screen</button>
    <button id="mic">🎤 Talk</button>
  </div>
</div>

<div id="listen">
  <div class="wave" id="wave"></div>
  <div id="heard" class="ph">Listening…</div>
  <input id="vin" placeholder="…or just type it" autocomplete="off">
  <div id="tryit"></div>
  <div id="lhint">Enter to send · Esc to cancel</div>
</div>

<button id="gear" title="Inspector (`)">⌘</button>
<div id="admin">
  <button class="close" id="aclose">×</button>
  <h3>Inspector</h3>
  <p class="sub">Everything the user never sees. <span class="kbd">`</span> to toggle.</p>
  <section><h4>agent</h4><pre id="a-agent"></pre>
    <button class="sbtn" id="a-new" style="margin-top:9px;font-size:12.5px">start a new conversation</button>
  </section>
  <section><h4>what the agent declared</h4><pre id="a-tree"></pre></section>
  <section><h4>what the solver decided</h4><pre id="a-solve"></pre></section>
  <section><h4>blocks in use</h4><pre id="a-blocks"></pre></section>
  <section><h4>events sent to the agent</h4><pre id="a-events"></pre></section>
  <section><h4>gated actions</h4><pre id="a-gates"></pre></section>
</div>

<script>
/* ============================================================
   aOS — hollow mock. Every interaction is real; every backend is fake.
   Press ` for the inspector.
   ============================================================ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const el=(t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n};
const wait=ms=>new Promise(r=>setTimeout(r,ms));

const CATALOG={Row:[200,44],Column:[160,80],Card:[200,100],Text:[130,28],Image:[130,90],
  DataView:[300,180],Button:[100,44],TextField:[190,46],ChoicePicker:[190,44],
  Confirm:[300,140],Ask:[260,116],Status:[230,72],Error:[260,116],Foreign:[560,380]};
const ACTIONABLE=["Ask","Confirm","Error","Button","TextField","ChoicePicker"];
const GATED=["spend money","send a message as you","delete anything",
  "agree to terms or grant a permission","type into a login or payment field",
  "move a file off your machine"];

let S={tiles:[],say:"Say something.",mode:"ambient",busy:false};
let INPUT={}, EVENTS=[], LASTSOLVE=null;

/* ---------- speech out ---------- */
let voiceOn=true;
function speak(t,quiet){
  S.say=t; $("#say").textContent=t;
  if(voiceOn && !quiet && window.speechSynthesis){
    try{ speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(t); u.rate=1.06; u.pitch=1; u.volume=.85;
      speechSynthesis.speak(u);
    }catch(e){}
  }
}
const busy=b=>{S.busy=b;$("#dot").className=b?"busy":(S.tiles.length?"live":"")};

/* ---------- blocks ---------- */
const UNKNOWN=new Set();
function draw(b){
  switch(b.t){
    case "Text":{
      if(b.style==="clock"){ const d=el("div"); d.appendChild(el("p","clock",b.v));
        if(b.sub)d.appendChild(el("p","cdate",b.sub)); return d }
      const d=el("div");
      d.appendChild(b.style==="h"?el("h2","bt",b.v):el("p","bd",b.v));
      if(b.sub) d.appendChild(el("p","bd",b.sub));   // sub works on every Text, not just the clock
      return d;}

    case "DataView": return dataView(b);

    case "TextField":{
      const i=el("input","fld"); i.placeholder=b.ph||""; i.value=INPUT[b.id]??"";
      i.oninput=e=>{INPUT[b.id]=e.target.value; admin();};
      return i;}

    case "ChoicePicker":{
      const d=el("div","chips");
      b.opts.forEach(o=>{const c=el("button","chip",o);
        c.setAttribute("aria-pressed",String((INPUT[b.id]??b.v)===o));
        c.onclick=()=>{INPUT[b.id]=o; b.onpick&&b.onpick(o); render();};
        d.appendChild(c)});
      return d;}

    case "Button":{
      const x=el("button","act"+(b.ghost?" g2":""),b.v);
      x.onclick=()=>act(b,"press",b.v);
      return x;}

    case "Status":{
      const d=el("div","status");
      d.appendChild(el("div","ring"));
      const t=el("div"); t.appendChild(el("b",null,b.v)); t.appendChild(el("span",null,b.sub||""));
      d.appendChild(t); return d;}

    case "Ask":{
      const d=el("div","sys ask");
      d.appendChild(el("div","lbl","aOS is asking"));
      d.appendChild(el("div",null,b.v));
      const r=el("div","row");
      (b.opts||["Yes","No"]).forEach((o,i)=>{const x=el("button","act"+(i?" g2":""),o);
        x.onclick=()=>act(b,"answer",o); r.appendChild(x)});
      d.appendChild(r); return d;}

    case "Error":{
      const d=el("div","sys error");
      d.appendChild(el("div","lbl","that didn't work"));
      d.appendChild(el("div",null,b.v));
      const x=el("button","act g2","Try something else");
      x.onclick=()=>act(b,"press","retry");
      d.appendChild(x); return d;}

    case "Confirm":{
      const d=el("div","sys confirm");
      d.appendChild(el("div","lbl","needs your thumb"));
      d.appendChild(el("div",null,b.v));
      d.appendChild(el("div","lock","🔒 "+(b.gate||GATED[0])));
      const r=el("div","row");
      const y=el("button","act",b.yes||"Yes, do it");
      y.onclick=()=>act(b,"confirm","yes");
      const n=el("button","act g2","Not now");
      n.onclick=()=>act(b,"confirm","no");
      r.append(y,n); d.appendChild(r); return d;}

    case "Foreign":{
      const d=el("div","foreign");
      const c=el("div","fchrome"); c.appendChild(el("span",null,"◉"));
      c.appendChild(el("div","u",b.url)); d.appendChild(c);
      const bd=el("div","fbody"); bd.innerHTML=b.html; d.appendChild(bd); return d;}

    /* containers — the prompt always advertised these; the renderer did not
       implement them, so a live agent produced a screen of empty boxes.
       Contract and renderer must not drift. */
    case "Row":{ const d=el("div","brow");
      (b.c||[]).forEach(k=>d.appendChild(draw(k))); return d;}
    case "Column":{ const d=el("div","bcol");
      (b.c||[]).forEach(k=>d.appendChild(draw(k))); return d;}
    case "Card":{ const d=el("div","bcard");
      (b.c||[]).forEach(k=>d.appendChild(draw(k))); return d;}
  }
  /* unknown block — make drift loud, never silent */
  UNKNOWN.add(b.t);
  return el("div","unk","unrenderable block: "+b.t);
}

function dataView(b){
  if(b.shape==="gallery"){
    const g=el("div","gal");
    b.rows.forEach(r=>{const c=el("div","g");
      c.dataset.sel=String(INPUT[b.id]===r.name);
      const p=el("div","pic",r.icon); p.style.background=r.bg||"linear-gradient(135deg,#2c3purple,#1b2230)";
      p.style.background=r.bg||"linear-gradient(135deg,#33405c,#1b2230)";
      c.appendChild(p);
      const m=el("div","mt"); m.appendChild(el("b",null,r.name));
      m.appendChild(el("span",null,r.meta)); c.appendChild(m);
      c.onclick=()=>{INPUT[b.id]=r.name;
        if(b.onpick){fire(b,"press",r.name); b.onpick(r)} else act(b,"press",r.name)};
      g.appendChild(c)});
    return g;}

  if(b.shape==="table"){
    const t=el("table","dv"), h=el("tr");
    b.cols.forEach(c=>h.appendChild(el("th",null,c))); t.appendChild(h);
    b.rows.forEach(r=>{const tr=el("tr");
      b.cols.forEach(c=>tr.appendChild(el("td",null,String(r[c]??"")))); t.appendChild(tr)});
    return t;}

  if(b.shape==="calendar"){
    const g=el("div","cal");
    ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].forEach(d=>g.appendChild(el("div","hd",d)));
    const today=(new Date().getDay()+6)%7;
    for(let i=0;i<7;i++){const c=el("div","cel"+(i===today?" today":""));
      b.rows.filter(r=>r.day===i).forEach(r=>{const e=el("div","ev"+(r.fresh?" new":""));
        e.appendChild(el("b",null,r.at)); e.appendChild(document.createTextNode(r.name));
        c.appendChild(e)});
      g.appendChild(c)}
    return g;}

  if(b.shape==="timeline"){
    const d=el("div");
    b.rows.forEach(r=>{const i=el("p","bd",r.at+"  ·  "+r.name); d.appendChild(i)});
    return d;}
  return el("div");
}

/* ---------- events ---------- */
function fire(b,action,v){
  const tile=S.tiles.find(t=>(t.blocks||[]).some(x=>x===b));
  const vals={}; (tile?.blocks||[]).forEach(x=>{if(x.id&&INPUT[x.id]!==undefined)vals[x.id]=INPUT[x.id]});
  const ev={tile:tile?.id||"?",block:b.id||b.t,action,value:v,values:vals};
  EVENTS.unshift(ev); admin(); return ev;
}
/* One finalising action → log it, then either drive the built-in mock
   flow (offline) or hand it to the live agent as the next turn. */
function act(b,action,v){
  const ev=fire(b,action,v);
  if(b.go) return b.go(action==="confirm"?(v==="yes"):v);
  if(LIVE) agentTurn({event:ev});
}

/* ---------- layout solver ---------- */
const GV=12,GH=14;
function bmin(b){
  let [w,h]=CATALOG[b.t]||[130,28];
  if(b.t==="Text"&&b.style==="clock") h=200;
  if(b.t==="DataView"&&b.shape==="calendar") h=300;
  if(b.t==="DataView"&&b.shape==="gallery") h=Math.max(160,Math.ceil(b.rows.length/3)*118);
  if(b.t==="DataView"&&b.shape==="table") h=64+b.rows.length*38;
  return [w,h];
}
function tmin(t){
  const m=(t.blocks||[]).map(bmin);
  if(!m.length)return [220,110];
  return [Math.max(210,...m.map(x=>x[0]))+44,
          Math.max(90, m.reduce((a,x)=>a+x[1]+GV,-GV))+40];
}
function solve(tiles,W,H){
  const rank=[...tiles].sort((a,b)=>a.importance-b.importance);
  const rows=[],dropped=[]; let row=[],rw=0;
  for(const t of rank){
    const [mw,mh]=tmin(t); t._m=[mw,mh];
    if(mw>W){ if(row.length){rows.push(row);row=[];rw=0} rows.push([t]); continue; }
    const nx=rw?rw+GH+mw:mw;
    const same=row.length&&row[row.length-1].group&&row[row.length-1].group===t.group;
    if(nx<=W&&(row.length<3||same)){row.push(t);rw=nx}
    else{rows.push(row);row=[t];rw=mw}
  }
  if(row.length)rows.push(row);
  let used=0; const keep=[];
  for(const r of rows){
    const rh=Math.max(...r.map(t=>t._m[1]));
    /* A tile the user can ACT on is never dropped. Content-only tiles are
       what gives way. (The first version of this rule only protected
       Ask/Confirm/Error — a live agent put the primary action in a Button
       tile of its own and the screen ate it.) */
    const must=r.some(t=>(t.blocks||[]).some(b=>ACTIONABLE.includes(b.t)));
    if(used+rh>H && !must){ r.forEach(t=>dropped.push({t,why:"no room"})); continue; }
    used+=rh+GV; keep.push(r);
  }
  return {rows:keep,dropped,used,budget:H};
}

/* ---------- render ---------- */
function render(){
  const c=$("#canvas"); c.innerHTML="";
  const W=c.clientWidth||window.innerWidth-36, H=c.clientHeight||window.innerHeight-110;

  if(S.mode==="foreign"){
    const t=S.tiles[0], d=el("div","tile"); d.style.flex="1"; d.style.padding="0";
    d.style.background="transparent"; d.style.border="0";
    (t.blocks||[]).forEach(b=>d.appendChild(draw(b)));
    const r=el("div","trow"); r.style.flex="1"; r.appendChild(d); c.appendChild(r);
    LASTSOLVE={rows:[[t]],dropped:[],used:H,budget:H}; admin(); return;
  }
  const res=solve(S.tiles,W,H); LASTSOLVE=res;
  res.rows.forEach(r=>{
    const rw=el("div","trow");
    r.forEach(t=>{
      const d=el("div","tile"+(t.ambient?" ambient":""));
      d.style.flex="1 1 "+t._m[0]+"px";
      (t.blocks||[]).forEach(b=>d.appendChild(draw(b)));
      rw.appendChild(d)});
    rw.style.flex=r.some(t=>t.grow)?"1":"none";
    c.appendChild(rw)});
  admin();
}

/* ---------- tiles ---------- */
const T=(id,imp,blocks,extra={})=>({id,importance:imp,blocks,...extra});
function addTile(t){ S.tiles.push(t); render(); }
function dropTile(id){ S.tiles=S.tiles.filter(t=>t.id!==id); render(); }
function ambient(){
  const d=new Date();
  S.mode="ambient"; S.tiles=[T("clock",1,[{t:"Text",style:"clock",
    v:d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}),
    sub:d.toLocaleDateString([],{weekday:"long",month:"long",day:"numeric"})}],{ambient:true,grow:true})];
  $("#back").style.display="none"; busy(false); render();
}

/* ---------- routing ---------- */
/* order matters — a leading verb beats a noun that appears later */
const ROUTES=[
  [/log ?(me )?in|sign ?(me )?in|authenticate|credentials|password/i, ()=>loginFlow()],
  [/^(take a |make a )?note\b|remember this/i, q=>noteFlow(q.replace(/^(take a |make a )?note:?\s*/i,""))],
  [/^(add|book|schedule|put)\b/i, q=>addEventFlow(
      q.replace(/^(add|book|schedule|put)\s*/i,"")
       .replace(/\s*(on|to|in)\s+(my\s+)?(calendar|diary|schedule|monday|tuesday|wednesday|thursday|friday).*$/i,"")
       .trim()||"New event")],
  [/week|calendar|diary|my day|agenda/i, ()=>weekFlow()],
  [/thai|food|eat|hungry|doordash|dinner|lunch|takeaway|order/i, ()=>foodFlow()],
  [/car|ride|uber|taxi|lift|home/i, ()=>rideFlow()],
  [/fail|error|break|stuck|went wrong/i, ()=>errorFlow()]
];
function run(q){
  q=q.trim(); if(!q) return;
  EVENTS.unshift({tile:"—",block:"voice",action:"say",values:{text:q}});
  if(S.mode==="ambient") S.tiles=S.tiles.filter(t=>t.id!=="clock");
  S.mode="tiled";
  if(LIVE) return agentTurn({text:q});
  const r=ROUTES.find(([re])=>re.test(q));
  (r? r[1](q) : unknownFlow(q));
}

/* ============================================================
   LIVE MODE — the screen is generated by your local Claude Code.
   Server proxies to `claude -p` on your own login. Every fact
   in every screen it returns is invented.
   ============================================================ */
/* One continuous conversation, not a fresh context per turn — the agent
   remembers what it showed you three turns ago. Survives a page reload,
   because the thing replacing this later (Hermes) remembers across restarts. */
let LIVE=false, META={};
let SESSION=localStorage.getItem("aos.session")||null;
const setSession=s=>{SESSION=s; s?localStorage.setItem("aos.session",s):localStorage.removeItem("aos.session")};
function newConversation(){ setSession(null); EVENTS.length=0; ambient();
  speak("Fresh start. I've forgotten everything.",true); admin(); }
async function health(){
  try{ const r=await fetch("/health",{cache:"no-store"});
       if(!r.ok) return false; const j=await r.json();
       META.model=j.model; return !!j.ok;
  }catch(e){ return false }
}
function applyScreen(o){
  const keep=new Set(o.keep||[]);
  const kept=S.tiles.filter(t=>keep.has(t.id));
  const incoming=(o.tiles||[]).map((t,i)=>({
    id:t.id||("t"+i), importance:t.importance??(i+1), group:t.group||null,
    blocks:(t.blocks||[]).filter(b=>b&&b.t), grow:true}));
  S.tiles=[...kept.filter(k=>!incoming.some(t=>t.id===k.id)), ...incoming];
  S.mode = o.mode==="foreign" ? "foreign" : "tiled";
  $("#back").style.display = S.mode==="foreign" ? "" : "none";
  render();
}
async function agentTurn(payload){
  busy(true); speak("…",true); $("#say").textContent="thinking";
  const t0=performance.now();
  try{
    const res=await fetch("/agent",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({...payload, session:SESSION,
        screen:S.tiles.map(t=>({id:t.id,blocks:t.blocks.map(b=>b.t)})),
        // the renderer tells the agent what would not fit last turn, so its
        // speech and the screen cannot drift apart
        dropped:(LASTSOLVE?.dropped||[]).map(d=>d.t.id)})});
    const rd=res.body.getReader(), dec=new TextDecoder(); let buf="";
    for(;;){
      const {value,done}=await rd.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      const parts=buf.split("\n\n"); buf=parts.pop();
      for(const p of parts){
        const m=p.match(/^data: (.*)$/m); if(!m) continue;
        const ev=JSON.parse(m[1]);
        if(ev.type==="thinking") $("#say").textContent="thinking…";
        else if(ev.type==="say") speak(ev.v);          // talks before the screen lands
        else if(ev.type==="screen"){
          setSession(ev.session); META={...META,ms:ev.ms,cost:ev.cost,model:ev.model,ok:true};
          META.turns=(META.turns||0)+1; META.spent=(META.spent||0)+(ev.cost||0);
          applyScreen(ev.screen);
        } else if(ev.type==="error"){
          META={...META,ms:ev.ms,ok:false,raw:ev.raw||ev.v};
          S.tiles=[T("agenterr",1,[{t:"Error",id:"e",
            v:"The agent returned something I couldn't render. Press ` to see what it sent."}])];
          render(); speak("That didn't come back in a shape I can draw.");
        }
      }
    }
  }catch(e){
    META={...META,ok:false,raw:String(e)};
    speak("I lost the agent. Is the server still running?");
  }
  META.wall=Math.round(performance.now()-t0);
  busy(false); admin();
}

/* ---------- voice in ---------- */
const SUGGEST=["Order some Thai food","What does my week look like","Get me a car home",
  "Add dentist to my calendar","Take a note: call the plumber","Log me into Uber","Show me an error"];
let rec=null, listening=false;
function openMic(){
  listening=true; $("#listen").classList.add("on"); $("#mic").classList.add("on");
  $("#heard").className="ph"; $("#heard").textContent="Listening…";
  $("#vin").value=""; setTimeout(()=>$("#vin").focus(),60);
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR){
    try{
      rec=new SR(); rec.lang="en-US"; rec.interimResults=true;
      rec.onresult=e=>{ const t=[...e.results].map(r=>r[0].transcript).join("");
        $("#heard").className=""; $("#heard").textContent=t;
        if(e.results[e.results.length-1].isFinal){ closeMic(); run(t); } };
      rec.onerror=()=>{ $("#heard").className="ph"; $("#heard").textContent="Mic unavailable — type instead."; };
      rec.start();
    }catch(e){ $("#heard").textContent="Type it below."; }
  } else $("#heard").textContent="Type it below.";
}
function closeMic(){
  listening=false; $("#listen").classList.remove("on"); $("#mic").classList.remove("on");
  if(rec){try{rec.stop()}catch(e){} rec=null}
}
$("#mic").onclick=()=>listening?closeMic():openMic();
$("#vin").onkeydown=e=>{ if(e.key==="Enter"){const v=e.target.value; closeMic(); run(v)} };
$("#back").onclick=()=>{ S.mode="tiled"; $("#back").style.display="none";
  if(!S.tiles.length||S.tiles[0].blocks[0].t==="Foreign") ambient(); else render();
  speak("Back to your screen.",true) };
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ closeMic(); $("#admin").classList.remove("on") }
  else if(e.key==="`"){ e.preventDefault(); $("#admin").classList.toggle("on"); admin() }
  else if(e.key===" "&&!listening&&document.activeElement.tagName!=="INPUT"){ e.preventDefault(); openMic() }
});
$("#gear").onclick=()=>{ $("#admin").classList.toggle("on"); admin() };
$("#aclose").onclick=()=>$("#admin").classList.remove("on");
$("#a-new").onclick=()=>newConversation();
for(let i=0;i<7;i++){ const b=el("i"); b.style.animationDelay=(i*.11)+"s"; $("#wave").appendChild(b) }
SUGGEST.forEach(s=>{ const c=el("button","chip",s);
  c.onclick=()=>{ closeMic(); run(s) }; $("#tryit").appendChild(c) });

/* ---------- inspector ---------- */
function admin(){
  if(!$("#admin").classList.contains("on")) return;
  $("#a-tree").textContent=JSON.stringify(S.tiles.map(t=>({
    id:t.id,importance:t.importance,group:t.group||null,
    blocks:(t.blocks||[]).map(b=>b.id?b.t+"#"+b.id:b.t)})),null,1);
  const r=LASTSOLVE;
  $("#a-solve").innerHTML = r ? (
    r.rows.map((row,i)=>"row "+(i+1)+": "+row.map(t=>t.id+" ["+(t._m?t._m.join("×"):"—")+"]").join("  ")).join("\n")
    +"\n\nused "+Math.round(r.used)+" / "+Math.round(r.budget)+" px"
    +(r.dropped.length?'\n<span class="badln">dropped: '+r.dropped.map(d=>d.t.id).join(", ")+"</span>"
      :'\n<span class="goodln">nothing dropped</span>')
    +'\n<span class="warnln">tiles you can act on are never droppable</span>') : "—";
  const used=new Set(); S.tiles.forEach(t=>(t.blocks||[]).forEach(b=>used.add(b.t)));
  $("#a-blocks").innerHTML=[...used].sort().join("\n")+"\n\n"+used.size+" of 14 in use"
    +(UNKNOWN.size?'\n<span class="badln">UNRENDERABLE: '+[...UNKNOWN].join(", ")+"</span>":"");
  $("#a-events").textContent=EVENTS.length?EVENTS.slice(0,8).map(e=>
    e.tile+"."+e.block+" · "+e.action+"\n  "+JSON.stringify(e.values)).join("\n"):"nothing yet";
  $("#a-gates").textContent=GATED.map(g=>"• "+g).join("\n")+"\n\nenforced outside the agent";
  $("#a-agent").innerHTML = LIVE
    ? '<span class="goodln">live · claude -p · '+(META.model||"?")+' · your subscription</span>\n'
      +"last turn: "+(META.wall??"—")+" ms wall, "+(META.ms??"—")+" ms agent\n"
      +"cost: $"+(META.cost!=null?META.cost.toFixed(4):"—")+" this turn, $"
      +(META.spent||0).toFixed(3)+" over "+(META.turns||0)+" turns\n"
      +"conversation: "+(SESSION||"new").slice(0,8)+"  (one continuous session, survives reload)\n"
      +"json: "+(META.ok===false?'<span class="badln">INVALID</span>':'<span class="goodln">valid</span>')
      +(META.raw?"\n\nraw:\n"+META.raw.replace(/</g,"&lt;").slice(0,400):"")
    : '<span class="warnln">offline · built-in mock flows</span>\n'
      +"start the agent to generate screens for real:\n  node prototype/server.mjs";
}

/* ---------- go ---------- */
ambient();
setInterval(()=>{ if(S.mode==="ambient"&&!S.busy) ambient() },15000);
addEventListener("resize",()=>render());
health().then(ok=>{ LIVE=ok;
  if(ok){ $("#say").textContent="Say something. — live agent";
          SUGGEST.length=0;
          ["Order some Thai food","What does my week look like","Get me a car home",
           "Plan a weekend in Lisbon","Show me my unread email","Compare three noise-cancelling headphones",
           "Log me into Uber"].forEach(s=>SUGGEST.push(s));
          $("#tryit").innerHTML="";
          SUGGEST.forEach(s=>{const c=el("button","chip",s);
            c.onclick=()=>{closeMic(); run(s)}; $("#tryit").appendChild(c)}); }
  admin(); });
</script>
